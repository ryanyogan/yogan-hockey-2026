name: Deploy

# A merge to main: the checks again on the merged code, then the D1 migrations, then the Worker.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  gate:
    name: Can production deploy?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/deploy-gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-gate.sh production

  deploy:
    name: Migrate D1 and deploy the Worker
    needs: [ci, gate]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, and never one cancelled between its migrations and its upload. Of
    # several waiting, GitHub keeps the newest.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Migrations first: they are additive only, so the Worker still running works on the new
      # schema, and the new Worker never meets the old one. Before the build, too: once there is
      # a build, wrangler reads the configuration the build wrote in place of wrangler.jsonc.
      # `DB` is the binding; wrangler.jsonc names the database and where its migrations are.
      - name: Apply the D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote </dev/null

      - name: Build
        run: pnpm build

      # Uploads what the build wrote (dist/, found through .wrangler/deploy/config.json). The
      # Worker has no secrets, so the deploy uploads none.
      - name: Deploy the Worker
        run: |
          subject=$(git log -1 --pretty=%s | cut -c1-100)
          pnpm exec wrangler deploy --tag "${GITHUB_SHA::7}" --message "$subject" </dev/null
