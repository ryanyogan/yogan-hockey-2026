name: Preview

# A preview of each pull request, on the preview KV and D1, never the production pair
# (`previews` in apps/web/wrangler.jsonc). It does not wait for CI and CI does not wait for it.
#
# Switched off for now by scripts/deploy-gate.sh, which says why: the gate answers no, so the
# deploy job below is skipped and has never run against Cloudflare.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Can a preview deploy?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/deploy-gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-gate.sh preview

  preview:
    name: Deploy the preview
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time for a pull request, and never cancelled halfway through the migrations. Two
    # pull requests can still migrate the shared preview D1 at once; applying is idempotent, so
    # rerun the one that lost.
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        # Named so that it runs with pipefail: the deploy below is piped.
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `wrangler d1 migrations apply` knows only the databases at the top level of a
      # configuration, which is production's. So the preview database is handed to it in a
      # configuration of its own, written from `previews` in wrangler.jsonc.
      - name: Apply the D1 migrations to the preview database
        run: |
          node ../../scripts/preview-d1-config.mjs >"$RUNNER_TEMP/preview-d1.json"
          pnpm exec wrangler d1 migrations apply DB --remote --config "$RUNNER_TEMP/preview-d1.json" </dev/null

      - name: Build
        run: pnpm build

      # Never run: the names of the URLs in wrangler's JSON are a guess until one has.
      - name: Deploy the preview
        env:
          PREVIEW_NAME: pr-${{ github.event.number }}
        run: |
          pnpm exec wrangler preview --name "$PREVIEW_NAME" --json </dev/null | tee "$RUNNER_TEMP/preview.json"
          urls=$(jq -r '[.. | strings | select(startswith("https://"))] | unique | join(" ")' "$RUNNER_TEMP/preview.json" || true)
          echo "::notice title=Preview deployed::$PREVIEW_NAME ${urls:-(wrangler printed no URL; see the log)}"
