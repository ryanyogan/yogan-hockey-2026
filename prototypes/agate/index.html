<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="./style.css">
<script>
  // Before paint, like next-themes: ?theme= wins, then the stored choice, then the system.
  (() => {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q;
    if (!t) { try { t = localStorage.getItem("theme"); } catch (e) {} }
    if (!t || t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    if (t === "dark") document.documentElement.classList.add("dark");
  })();
</script>
</head>
